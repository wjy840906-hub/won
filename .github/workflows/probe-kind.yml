name: KIND 응답 구조 진단

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: KIND 응답 뜯어보기
        env:
          PYTHONPATH: src
        run: |
          mkdir -p out
          python -m kind_managed --probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kind-html
          path: out/*.html
          if-no-files-found: warn
