name: 예약 매크로

# 기본은 수동 실행입니다. 정해진 시각에 돌리려면 아래 schedule 의 주석을 풀고
# 예약 오픈 시각보다 몇 분 앞선 시각(UTC 기준)으로 맞추세요.
# GitHub 의 스케줄은 몇 분 늦게 뜰 수 있으므로, 시나리오의 open_at 으로
# 정확한 시각을 맞추고 워크플로는 조금 일찍 시작하는 편이 안전합니다.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 시나리오 파일 경로
        required: true
        default: scenarios/example-meeting-room.yaml
      dry_run:
        description: 확정 단계를 누르지 않고 점검만
        type: boolean
        default: true
      email:
        description: 결과를 메일로 받기
        type: boolean
        default: false
  # schedule:
  #   - cron: "50 23 * * 0-4"   # 평일 08:50 KST

jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt -r requirements-booking.txt
          python -m playwright install --with-deps chromium

      - name: 시나리오 점검
        run: PYTHONPATH=src python -m booking_macro "${{ inputs.scenario || 'scenarios/example-meeting-room.yaml' }}" --check

      - name: 예약 실행
        env:
          BOOKING_USER: ${{ secrets.BOOKING_USER }}
          BOOKING_PASSWORD: ${{ secrets.BOOKING_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
        run: |
          PYTHONPATH=src python -m booking_macro \
            "${{ inputs.scenario || 'scenarios/example-meeting-room.yaml' }}" \
            ${{ inputs.dry_run == false && ' ' || '--dry-run' }} \
            ${{ inputs.email == true && '--email' || ' ' }} \
            -v

      - name: 실행 화면 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-screenshots
          path: out/booking/
          if-no-files-found: ignore
          retention-days: 7
