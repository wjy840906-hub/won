# 도봉구 시설예약 — 다락원체육공원 테니스 코트
# https://yeyak.dobongsiseol.or.kr
#
# 화면 흐름 (스크린샷으로 확인한 실제 구조):
#   시설예약 ▸ 다락원체육공원 ▸ 시설예약일정현황
#     → 달력에서 '예약가능' 날짜 클릭
#     → 코트(가로) × 시간(세로) 표에서 '선택' 칸 클릭
#     → 예약신청
#
# 코트: 실내코트1~3 · 실외코트4~8 · 다락원축구장
# 시간: 06:00~07:00 부터 21:00~22:00 까지 1시간 단위
#       (실내코트1·2 의 12:00~13:00 은 클리닝타임이라 잡을 수 없습니다)
#
# ⚠ 아직 채워야 할 것: 로그인 주소·입력칸, 예약 화면 주소(#TODO 표시).
#    이 저장소를 만든 환경에서는 사이트에 접속할 수 없어(조직 네트워크 정책)
#    그 부분은 확인하지 못했습니다. 아래로 뽑아서 채우세요.
#
#      PYTHONPATH=src python -m booking_macro \
#        --probe https://yeyak.dobongsiseol.or.kr \
#        --probe-click "text=시설예약" --probe-click "text=다락원체육공원" \
#        --probe-click "text=시설예약일정현황" --headed
#
#    (Actions 탭 → "예약 사이트 화면 진단" 으로도 같은 일을 할 수 있습니다.)
#    채운 뒤에는 반드시 --dry-run 으로 먼저 확인하세요.

name: 도봉 다락원 테니스장
base_url: https://yeyak.dobongsiseol.or.kr

# 예약 오픈 시각 — 사이트 공지에 맞추세요. 지우면 즉시 시도합니다.
# open_at: "09:00"

# 오픈 직후에는 화면이 느려 한 번에 실패하기 쉬우니 몇 차례 더 돌립니다.
attempts: 5
interval_sec: 15
jitter_sec: 3
deadline_sec: 900

login:
  url: "/TODO-로그인주소"
  steps:
    - fill: "#TODO-아이디입력칸"
      value: "{{ env.BOOKING_USER }}"
      label: "아이디 입력칸 — 셀렉터를 아직 채우지 않았습니다(--probe 참고)"
    - fill: "#TODO-비밀번호입력칸"
      value: "{{ env.BOOKING_PASSWORD }}"
      label: "비밀번호 입력칸 — 셀렉터를 아직 채우지 않았습니다"
    - click: "#TODO-로그인버튼"
      label: "로그인 버튼 — 셀렉터를 아직 채우지 않았습니다"
  success_when:
    # 화면 오른쪽 위가 '로그인 | 회원가입' → 로그인 후에는 바뀝니다.
    # 진단 결과를 보고 '로그아웃' 같은 확실한 것으로 바꾸세요.
    text_missing: "회원가입"

# 잡고 싶은 날짜 · 시간 · 코트. 위에서부터 차례로 시도합니다.
# 실외코트를 먼저 훑고, 안 되면 실내코트로 넘어가도록 짰습니다.
# 시간 표기는 화면 그대로 써야 합니다(06:00~07:00 형식, 물결표 ~).
targets:
  - date: "토"
    time: ["09:00~10:00", "10:00~11:00", "08:00~09:00"]
    court: ["실외코트4", "실외코트5", "실외코트6", "실외코트7", "실외코트8"]
  - date: "토"
    time: ["09:00~10:00", "10:00~11:00"]
    court: ["실내코트1", "실내코트2"]
  - date: "일"
    time: ["09:00~10:00", "10:00~11:00"]
    court: ["실외코트4", "실외코트5", "실외코트6", "실외코트7", "실외코트8"]

reserve:
  # 다락원체육공원 시설예약일정현황 화면. c_id 값은 진단 결과에서 확인해 채우세요
  # (주소창 예: /rent/index.php?c_id=0N&n_type=rent).
  url: "/TODO-다락원체육공원-예약일정현황주소"

  steps:
    # ① 달력에서 그 날짜 칸을 고른다.
    #    날짜 숫자와 '예약가능' 배지를 함께 가진 칸만 눌러, '예약종료'·'휴장일' 은
    #    자동으로 걸러집니다. 누를 수 없으면 그 날짜는 마감으로 보고 넘어갑니다.
    - click_cell:
      exact: "{{ target.day_no }}"        # 날짜는 '통째로' 같아야 합니다
      contains: "예약가능"                 # (contains 만 쓰면 5일을 찾다 15일을 누릅니다)
      label: "달력에서 예약가능한 날짜 고르기"

    # ② 시간표가 그려질 때까지 기다린다.
    - wait_for: "#TODO-시간표-셀렉터"
      label: "코트×시간 표 — 셀렉터를 아직 채우지 않았습니다"
      optional: true

    # ③ 코트(열) × 시간(행) 이 만나는 '선택' 칸을 누른다.
    #    헤더가 '실외코트5' 아래 '선택 | 시간' 2단으로 나뉘어 있어도 알아서 찾습니다.
    #    × 표시라 누를 수 없으면 '마감' 으로 보고 다음 후보로 넘어갑니다.
    - click_cell: "{{ target.court }}"
      row: "{{ target.time }}"
      label: "코트×시간 칸 고르기"

    - accept_dialog: true

    - click: "#TODO-예약신청버튼"
      commit: true               # --dry-run 이면 이 단계만 건너뜁니다
      label: "예약신청 버튼 — 셀렉터를 아직 채우지 않았습니다"

  success_when:
    text_contains: "TODO-예약완료문구"    # 예: "예약이 접수되었습니다"

  # 그날이 통째로 마감이면 달력에 '예약가능' 칸이 없어 '실패' 로 기록되고
  # 바로 다음 후보(다음 시간·다음 코트·다음 날)로 넘어갑니다. 정상 동작입니다.

  taken_when:
    # 칸이 ×/— 라서 못 누르는 경우는 위에서 이미 '마감' 으로 처리됩니다.
    # 여기에는 눌렀는데 거절당했을 때 뜨는 문구를 적으세요.
    text_contains: ["이미 예약", "예약마감", "신청이 마감"]
